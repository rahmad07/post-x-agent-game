<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One Prompt Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b1020;
    color: #e2e8f0;
    font-family: "DejaVu Sans", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  h1 {
    font-size: 34px;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  h1 span { color: #4ade80; }
  .sub {
    color: #94a3b8;
    font-size: 15px;
    margin-bottom: 14px;
  }
  #hud {
    display: flex;
    gap: 28px;
    margin-bottom: 10px;
    font-size: 20px;
    font-weight: bold;
  }
  #hud b { color: #facc15; }
  #hud .mode { color: #38bdf8; }
  canvas {
    background: #111827;
    border: 3px solid #1e293b;
    border-radius: 12px;
    box-shadow: 0 0 60px rgba(74, 222, 128, 0.15);
  }
  #msg {
    margin-top: 12px;
    font-size: 16px;
    color: #94a3b8;
    height: 22px;
  }
  #msg.over { color: #f87171; font-weight: bold; }
</style>
</head>
<body>
  <h1>ONE PROMPT <span>SNAKE</span></h1>
  <div class="sub">Built by an AI agent from a single prompt — play it yourself</div>
  <div id="hud">
    <div>SCORE <b id="score">0</b></div>
    <div>LENGTH <b id="len">3</b></div>
    <div>SPEED <b id="spd">1x</b></div>
    <div class="mode" id="mode">AUTOPILOT: ON</div>
  </div>
  <canvas id="game" width="768" height="448"></canvas>
  <div id="msg">Arrow keys / WASD to steer &middot; Space = autopilot &middot; R = restart</div>
<script>
(function () {
  var COLS = 24, ROWS = 14, CELL = 32;
  var cv = document.getElementById('game');
  var ctx = cv.getContext('2d');
  var scoreEl = document.getElementById('score');
  var lenEl = document.getElementById('len');
  var spdEl = document.getElementById('spd');
  var modeEl = document.getElementById('mode');
  var msgEl = document.getElementById('msg');

  var snake, dir, food, score, speed, tick, over, overAt, auto;
  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  function reset() {
    snake = [{ x: 6, y: 7 }, { x: 5, y: 7 }, { x: 4, y: 7 }];
    dir = 'right';
    score = 0;
    speed = 1;
    tick = 0;
    over = false;
    auto = true;
    placeFood();
    updateHud();
    msgEl.textContent = 'Arrow keys / WASD to steer \u00b7 Space = autopilot \u00b7 R = restart';
    msgEl.className = '';
  }

  function placeFood() {
    while (true) {
      var f = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
      var clash = snake.some(function (s) { return s.x === f.x && s.y === f.y; });
      if (!clash) { food = f; return; }
    }
  }

  function cellFree(x, y) {
    if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return false;
    return !snake.some(function (s) { return s.x === x && s.y === y; });
  }

  // Autopilot: pick the safe move that gets closest to the food.
  // Falls back to any safe move; if none exists, keeps going (game over).
  function autopilot() {
    var head = snake[0];
    var best = null, bestD = Infinity;
    var safe = [];
    Object.keys(DIRS).forEach(function (name) {
      var d = DIRS[name];
      var nx = head.x + d[0], ny = head.y + d[1];
      if (!cellFree(nx, ny)) return;
      safe.push(name);
      var dist = Math.abs(nx - food.x) + Math.abs(ny - food.y);
      if (dist < bestD) { bestD = dist; best = name; }
    });
    if (best) { dir = best; return; }
    if (safe.length) dir = safe[0];
  }

  function step() {
    if (over) return;
    if (auto) autopilot();
    var d = DIRS[dir];
    var head = { x: snake[0].x + d[0], y: snake[0].y + d[1] };
    if (!cellFree(head.x, head.y)) {
      over = true;
      overAt = Date.now();
      msgEl.textContent = 'GAME OVER — score ' + score + '. Restarting...';
      msgEl.className = 'over';
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      if (score % 50 === 0 && speed < 3) speed += 0.5;
      placeFood();
    } else {
      snake.pop();
    }
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = score;
    lenEl.textContent = snake.length;
    spdEl.textContent = speed.toFixed(1).replace('.0', '') + 'x';
    modeEl.textContent = 'AUTOPILOT: ' + (auto ? 'ON' : 'OFF');
  }

  function draw() {
    ctx.fillStyle = '#111827';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.strokeStyle = 'rgba(148,163,184,0.08)';
    ctx.lineWidth = 1;
    for (var x = 1; x < COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, cv.height); ctx.stroke();
    }
    for (var y = 1; y < ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(cv.width, y * CELL); ctx.stroke();
    }
    // food
    ctx.fillStyle = '#f472b6';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 5, 0, Math.PI * 2);
    ctx.fill();
    // snake
    snake.forEach(function (s, i) {
      ctx.fillStyle = i === 0 ? '#86efac' : '#4ade80';
      var pad = i === 0 ? 2 : 4;
      ctx.fillRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
    });
    if (over) {
      ctx.fillStyle = 'rgba(11,16,32,0.72)';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#f87171';
      ctx.font = 'bold 44px "DejaVu Sans", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', cv.width / 2, cv.height / 2 - 8);
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 24px "DejaVu Sans", Arial, sans-serif';
      ctx.fillText('SCORE ' + score, cv.width / 2, cv.height / 2 + 34);
    }
  }

  function loop() {
    tick++;
    // ~8 steps a second at 1x, faster as speed grows
    var interval = Math.max(4, Math.round(8 / speed));
    if (tick % interval === 0) step();
    if (over && Date.now() - overAt > 1600) reset();
    draw();
    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    // Space toggles the autopilot; arrows / WASD steer (and switch it off).
    if (k === ' ' || k === 'spacebar') {
      auto = !auto; updateHud(); e.preventDefault(); return;
    }
    var map = { arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down',
                arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right' };
    if (map[k]) {
      if (auto) { auto = false; updateHud(); }
      var next = map[k];
      var opposite = { up: 'down', down: 'up', left: 'right', right: 'left' };
      if (next !== opposite[dir]) dir = next;
      e.preventDefault();
    }
    if (k === 'r') reset();
  });

  // State exposed for screenshots / tests.
  window.__snake = function () {
    return { score: score, length: snake.length, over: over, auto: auto };
  };

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
